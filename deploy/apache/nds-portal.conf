# Contoh konfigurasi Apache 2.4 untuk portal Laravel NDS di subfolder /portal/.
# Simpan sebagai file include di /etc/apache2/conf-available/ atau di dalam
# VirtualHost utama. VirtualHost domain lain tidak boleh disentuh:
# semua arahan portal dibatasi pada path /portal dan <Directory> di bawah ini.
#
# Modul yang dibutuhkan (a2enmod):
#   proxy proxy_fcgi proxy_wstunnel rewrite headers

# Alias subfolder ke folder public/ Laravel
Alias /portal /var/www/NDS-WEBSITE/public

<Directory /var/www/NDS-WEBSITE/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# PHP-FPM 8.3, nama socket harus sama dengan pool yang berjalan
<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
</FilesMatch>

# Proxy WebSocket Reverb. Browser konek ke wss://DOMAIN/portal/app/{key}
# (port 443); Apache menghentikan TLS lalu meneruskan sebagai ws biasa
# ke Reverb yang mengikat 127.0.0.1:8081.
ProxyPreserveHost On
ProxyPass /portal/app ws://127.0.0.1:8081/app retry=0
ProxyPassReverse /portal/app ws://127.0.0.1:8081/app
# Fallback path gaya socket.io untuk klien lama
ProxyPass /portal/socket.io ws://127.0.0.1:8081/ retry=0
ProxyPassReverse /portal/socket.io ws://127.0.0.1:8081/

# RewriteBase agar .htaccess Laravel menghasilkan URL benar di subfolder
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteBase /portal
    # Kirim semua ke front controller kecuali file/folder yang benar ada
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ index.php [QSA,L]
</IfModule>

# Contoh penempatan di dalam VirtualHost HTTPS (*:443). Blok wss:// hanya
# sah dari halaman https, jadi ProxyPass di atas juga harus ada di vhost 443.
# Isi vhost 80 yang tidak ada kaitannya boleh dibiarkan redirect ke https.

ErrorLog ${APACHE_LOG_DIR}/nds-portal-error.log
CustomLog ${APACHE_LOG_DIR}/nds-portal-access.log combined

# ModSecurity: JANGAN dinonaktifkan global, itu membuka semua domain.
# Bila satu rule salah positif pada endpoint portal tertentu, matikan
# rule itu saja dengan id dari audit log:
#   <LocationMatch "^/portal/endpoint-yang-bermasalah">
#       SecRuleRemoveById 942100
#   </LocationMatch>
